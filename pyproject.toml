[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylens"
version = "0.1.0"
description = "WinLens-like in-place screen translator for Windows (region + active window)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PyLens" }]
dependencies = [
  "PySide6>=6.6",
  "Pillow>=10.0",
  "mss>=9.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pywin32>=306",
  "winsdk>=1.0.0b10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
# Japanese OCR only — pin 2.x for smaller deps + stable classic API.
# Models are stored under <project>/models/paddle/ (not ~/.paddleocr).
paddle = [
  "paddlepaddle==2.6.2",
  "paddleocr==2.7.3",
  "numpy>=1.24,<2.0",
  # Paddle 2.6 ships old _pb2 stubs; protobuf 4+ breaks import.
  # Windows wheel constraint is <=3.20.2.
  "protobuf==3.20.2",
]
# Install from organization-approved offline wheels only.
offline = ["argostranslate>=1.9"]

[project.scripts]
pylens = "pylens.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "S110", "DTZ005", "PYI034"]
