[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylens"
version = "0.1.0"
description = "Cross-platform in-place screen translator (Windows, macOS, Linux)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PyLens" }]
dependencies = [
  "PySide6>=6.6",
  "Pillow>=10.0",
  "mss>=9.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "numpy>=1.24,<2.0",
  "protobuf==3.20.2",
]

[project.optional-dependencies]
# Windows-specific dependencies
windows = [
  "pywin32>=306",
  "winsdk>=1.0.0b10",
  "paddlepaddle==2.6.2",
  "paddleocr==2.7.3",
]

# macOS-specific dependencies
macos = [
  "paddlepaddle==2.6.2",
  "paddleocr==2.7.3",
  "pyobjc-framework-Vision>=10.2",
  "pyobjc-framework-Cocoa>=10.2",
  "pyobjc-framework-Quartz>=10.2",
  "pyobjc-core>=10.2",
]

# Linux-specific dependencies
linux = [
  "paddlepaddle==2.6.2",
  "paddleocr==2.7.3",
  "python-xlib>=0.33",
  "ewmh>=0.1.6",
  "dbus-python>=1.3",
]

# Cross-platform OCR (PaddleOCR) - works on all platforms
paddle = [
  "paddlepaddle==2.6.2",
  "paddleocr==2.7.3",
]

# Offline translation with Argos Translate
offline = ["argostranslate>=1.9"]

# Development dependencies
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.12",
]

# All platforms combined (for CI/testing)
all = [
  "pywin32>=306; sys_platform == 'win32'",
  "winsdk>=1.0.0b10; sys_platform == 'win32'",
  "pyobjc-framework-Vision>=10.2; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10.2; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.2; sys_platform == 'darwin'",
  "pyobjc-core>=10.2; sys_platform == 'darwin'",
  "python-xlib>=0.33; sys_platform == 'linux'",
  "ewmh>=0.1.6; sys_platform == 'linux'",
  "dbus-python>=1.3; sys_platform == 'linux'",
]

[project.scripts]
pylens = "pylens.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "S110", "DTZ005", "PYI034"]